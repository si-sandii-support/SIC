services:
  - type: web
    name: sic-document-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: MAX_BODY_MB
        value: "50"
      - key: CORS_ORIGIN
        sync: false
